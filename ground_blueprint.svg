<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 1540" width="840" height="1540" style="background:#ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <pattern id="hatch_north2" width="10" height="10" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#475569" stroke-width="2" />
    </pattern>
    <marker id="tick2" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <line x1="0" y1="10" x2="10" y2="0" stroke="#000000" stroke-width="2"/>
    </marker>
    <marker id="arrow2" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0284c7"/>
    </marker>
  </defs>

  <!-- Title & Orientation Banner -->
  <text x="420" y="36" text-anchor="middle" font-size="22" font-weight="800" fill="#0f172a" letter-spacing="1">GROUND FLOOR PLAN (COMMON)</text>
  <text x="420" y="58" text-anchor="middle" font-size="13" font-weight="600" fill="#64748b">30' × 60' • 7' REAR GALI W/ BATHROOMS • 4-SUV STILT PARKING • REAR SUITES</text>

  <!-- EXTERIOR DIMENSION LINES -->
  <line x1="120" y1="80" x2="720" y2="80" stroke="#000000" stroke-width="1.5" marker-start="url(#tick2)" marker-end="url(#tick2)" />
  <line x1="120" y1="70" x2="120" y2="100" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="720" y1="70" x2="720" y2="100" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3"/>
  <rect x="385" y="68" width="70" height="24" fill="#ffffff"/>
  <text x="420" y="86" text-anchor="middle" font-size="18" font-weight="800" fill="#000000">30'</text>

  <line x1="70" y1="100" x2="70" y2="1300" stroke="#000000" stroke-width="1.5" marker-start="url(#tick2)" marker-end="url(#tick2)" />
  <line x1="60" y1="100" x2="120" y2="100" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="60" y1="1300" x2="120" y2="1300" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="50" y="700.0" text-anchor="middle" font-size="18" font-weight="800" fill="#000000" transform="rotate(-90 50 700.0)">60'</text>

  <line x1="770" y1="100" x2="770" y2="1300" stroke="#000000" stroke-width="1.5" marker-start="url(#tick2)" marker-end="url(#tick2)" />
  <line x1="760" y1="100" x2="720" y2="100" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="760" y1="1300" x2="720" y2="1300" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="790" y="700.0" text-anchor="middle" font-size="18" font-weight="800" fill="#000000" transform="rotate(90 790 700.0)">60'</text>

  <!-- PLOT BOUNDARY -->
  <rect x="120" y="100" width="600" height="1200" fill="#f8fafc" stroke="#000000" stroke-width="3.5" />

  <!-- 1. NORTH SOLID COMPOUND WALL -->
  <rect x="120" y="100" width="600" height="14" fill="url(#hatch_north2)" stroke="#0f172a" stroke-width="2.5" />
  <rect x="250" y="101" width="340" height="12" fill="#0f172a" rx="2"/>
  <text x="420" y="110" text-anchor="middle" font-size="8" font-weight="800" fill="#ffffff" letter-spacing="0.5">◄ NORTH SOLID COMPOUND / PLOT BOUNDARY WALL ►</text>

  <!-- 2. REAR GALI ZONE (30'0" x 7'0", y = 114 to 254) -->
  <rect x="120" y="114" width="600" height="140" fill="#e2e8f0" stroke="#000000" stroke-width="2" />
  
  <!-- Attached Bath 1 in Gali (x = 120 to 240, y = 114 to 254) -->
  <rect x="120" y="114" width="120" height="140" fill="#f1f5f9" stroke="#000000" stroke-width="2.5" />
  <text x="180" y="175" text-anchor="middle" font-size="11" font-weight="800" fill="#0f172a">A.BATH 1</text>
  <text x="180" y="195" text-anchor="middle" font-size="10" font-weight="700" fill="#0284c7">6'0" × 7'0"</text>
  <text x="180" y="210" text-anchor="middle" font-size="8" font-weight="600" fill="#475569">[IN GALI]</text>
  <line x1="155" y1="254" x2="155" y2="230" stroke="#0284c7" stroke-width="2.5"/>
  <path d="M 155 230 A 24 24 0 0 1 179 254" fill="none" stroke="#0284c7" stroke-dasharray="2,2"/>
  <text x="180" y="245" font-size="8" font-weight="bold" fill="#0284c7">DOOR</text>

  <!-- Attached Bath 2 in Gali (x = 600 to 720, y = 114 to 254) -->
  <rect x="600" y="114" width="120" height="140" fill="#f1f5f9" stroke="#000000" stroke-width="2.5" />
  <text x="660" y="175" text-anchor="middle" font-size="11" font-weight="800" fill="#0f172a">A.BATH 2</text>
  <text x="660" y="195" text-anchor="middle" font-size="10" font-weight="700" fill="#0284c7">6'0" × 7'0"</text>
  <text x="660" y="210" text-anchor="middle" font-size="8" font-weight="600" fill="#475569">[IN GALI]</text>
  <line x1="685" y1="254" x2="685" y2="230" stroke="#0284c7" stroke-width="2.5"/>
  <path d="M 685 230 A 24 24 0 0 0 661 254" fill="none" stroke="#0284c7" stroke-dasharray="2,2"/>
  <text x="660" y="245" font-size="8" font-weight="bold" fill="#0284c7">DOOR</text>

  <!-- Central Gali Court -->
  <text x="420" y="175" text-anchor="middle" font-size="13" font-weight="800" fill="#0f172a">COMMON REAR GALI (VENTILATION CORRIDOR)</text>
  <text x="420" y="195" text-anchor="middle" font-size="11" font-weight="700" fill="#0284c7">18'0" × 7'0" OPEN CENTRAL BREEZEWAY</text>

  <!-- 3. REAR LIVING ROOMS (y = 254 to 530, Depth: 13'9" = 276px) -->
  <line x1="420" y1="254" x2="420" y2="530" stroke="#000000" stroke-width="3" />
  <line x1="120" y1="530" x2="720" y2="530" stroke="#000000" stroke-width="3" />

  <!-- REAR ROOM 1 (NW / Vayavya, 15'0" x 13'9") -->
  <rect x="120" y="254" width="300" height="276" fill="#ffffff" stroke="none" />
  <text x="270" y="380" text-anchor="middle" font-size="15" font-weight="800" fill="#000000">REAR ROOM 1</text>
  <text x="270" y="403" text-anchor="middle" font-size="13" font-weight="700" fill="#0284c7">15'0" × 13'9"</text>
  <text x="270" y="423" text-anchor="middle" font-size="10" font-weight="600" fill="#64748b">(206 SQ FT PURE • GUEST / OFFICE)</text>
  <line x1="135" y1="500" x2="405" y2="500" stroke="#000000" stroke-width="1" marker-start="url(#tick2)" marker-end="url(#tick2)" />
  <text x="270" y="495" text-anchor="middle" font-size="11" font-weight="700">15'0"</text>
  <!-- Door to Gali -->
  <line x1="330" y1="254" x2="330" y2="230" stroke="#0284c7" stroke-width="2"/>
  <path d="M 330 230 A 24 24 0 0 1 354 254" fill="none" stroke="#0284c7" stroke-dasharray="2,2"/>
  <text x="345" y="244" font-size="8" font-weight="bold" fill="#0284c7">DOOR</text>

  <!-- REAR ROOM 2 (NE / Ishanya, 15'0" x 13'9") -->
  <rect x="420" y="254" width="300" height="276" fill="#ffffff" stroke="none" />
  <text x="570" y="380" text-anchor="middle" font-size="15" font-weight="800" fill="#000000">REAR ROOM 2</text>
  <text x="570" y="403" text-anchor="middle" font-size="13" font-weight="700" fill="#0284c7">15'0" × 13'9"</text>
  <text x="570" y="423" text-anchor="middle" font-size="10" font-weight="600" fill="#64748b">(206 SQ FT PURE • ELDER / STAY)</text>
  <line x1="435" y1="500" x2="705" y2="500" stroke="#000000" stroke-width="1" marker-start="url(#tick2)" marker-end="url(#tick2)" />
  <text x="570" y="495" text-anchor="middle" font-size="11" font-weight="700">15'0"</text>
  <!-- Door to Gali -->
  <line x1="510" y1="254" x2="510" y2="230" stroke="#0284c7" stroke-width="2"/>
  <path d="M 510 230 A 24 24 0 0 0 486 254" fill="none" stroke="#0284c7" stroke-dasharray="2,2"/>
  <text x="495" y="244" font-size="8" font-weight="bold" fill="#0284c7">DOOR</text>

  <!-- 4. CIRCULATION CORE (WEST WALL, y = 530 to 780) -->
  <!-- LIFT ON BACKSIDE (x = 120 to 220, y = 530 to 630, 5'0" x 5'0") -->
  <rect x="120" y="530" width="100" height="100" fill="#e2e8f0" stroke="#000000" stroke-width="2.5" />
  <line x1="120" y1="530" x2="220" y2="630" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="220" y1="530" x2="120" y2="630" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="170" y="575" text-anchor="middle" font-size="10" font-weight="800">LIFT</text>
  <text x="170" y="588" text-anchor="middle" font-size="8" font-weight="700" fill="#475569">5'0" × 5'0"</text>
  <rect x="122" y="532" width="96" height="14" fill="#0284c7" rx="2"/>
  <text x="170" y="542" text-anchor="middle" font-size="8" font-weight="800" fill="#ffffff">[BACKSIDE]</text>

  <!-- STAIRS IN FRONT (x = 120 to 220, y = 630 to 780) -->
  <rect x="120" y="630" width="100" height="150" fill="#f8fafc" stroke="#000000" stroke-width="3" />
  <line x1="170" y1="630" x2="170" y2="780" stroke="#000000" stroke-width="2"/>
  <rect x="120" y="630" width="100" height="40" fill="#f1f5f9" stroke="#000000" stroke-width="1.5"/>
  <text x="170" y="655" text-anchor="middle" font-size="9" font-weight="800" fill="#0284c7">MID-LANDING</text>
  <line x1="120" y1="675" x2="170" y2="675" stroke="#94a3b8" stroke-width="1.2" />
<line x1="120" y1="689" x2="170" y2="689" stroke="#94a3b8" stroke-width="1.2" />
<line x1="120" y1="703" x2="170" y2="703" stroke="#94a3b8" stroke-width="1.2" />
<line x1="120" y1="717" x2="170" y2="717" stroke="#94a3b8" stroke-width="1.2" />
<line x1="120" y1="731" x2="170" y2="731" stroke="#94a3b8" stroke-width="1.2" />
<line x1="120" y1="745" x2="170" y2="745" stroke="#94a3b8" stroke-width="1.2" />
<line x1="120" y1="759" x2="170" y2="759" stroke="#94a3b8" stroke-width="1.2" />
  <line x1="170" y1="675" x2="220" y2="675" stroke="#94a3b8" stroke-width="1.2" />
<line x1="170" y1="689" x2="220" y2="689" stroke="#94a3b8" stroke-width="1.2" />
<line x1="170" y1="703" x2="220" y2="703" stroke="#94a3b8" stroke-width="1.2" />
<line x1="170" y1="717" x2="220" y2="717" stroke="#94a3b8" stroke-width="1.2" />
<line x1="170" y1="731" x2="220" y2="731" stroke="#94a3b8" stroke-width="1.2" />
<line x1="170" y1="745" x2="220" y2="745" stroke="#94a3b8" stroke-width="1.2" />
<line x1="170" y1="759" x2="220" y2="759" stroke="#94a3b8" stroke-width="1.2" />
  <line x1="195" y1="770" x2="195" y2="675" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow2)" />
  <text x="208" y="725" text-anchor="middle" font-size="9" font-weight="bold" fill="#0284c7" transform="rotate(-90 208 725)">UP</text>
  <text x="170" y="770" text-anchor="middle" font-size="9" font-weight="800">STAIRS [IN FRONT]</text>

  <!-- UNDER-STAIRS DRIVER / SERVICE TOILET & UTILITY -->
  <rect x="120" y="680" width="100" height="100" fill="#fef3c7" fill-opacity="0.8" stroke="#d97706" stroke-width="1.8" stroke-dasharray="3,3"/>
  <text x="170" y="715" text-anchor="middle" font-size="8.5" font-weight="800" fill="#b45309">UNDER-STAIRS</text>
  <text x="170" y="730" text-anchor="middle" font-size="8" font-weight="700" fill="#b45309">DRIVER TOILET</text>
  <text x="170" y="743" text-anchor="middle" font-size="7.5" font-weight="600" fill="#78350f">&amp; UTILITY</text>

  <!-- OPEN EXPANDED PARKING COURT (Full 30ft width in front!) -->
  <text x="450" y="850" text-anchor="middle" font-size="18" font-weight="900" fill="#0f172a">COVERED STILT PARKING</text>
  <text x="450" y="880" text-anchor="middle" font-size="15" font-weight="800" fill="#0284c7">FULL 30'0" FRONT ENTRY COURT</text>
  <text x="450" y="905" text-anchor="middle" font-size="13" font-weight="700" fill="#16a34a">(~1,150 SQ FT UNOBSTRUCTED PARKING &amp; TURNAROUND)</text>
  <text x="450" y="930" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">[Accommodates 4 Full-Size SUVs + 4–6 Bikes with Wide Turn Radius]</text>
  <text x="450" y="950" text-anchor="middle" font-size="11" font-weight="700" fill="#0369a1">[Front 26+ feet completely clear of stairs for effortless drive-in]</text>

  <!-- Dimension line across front stilt parking (30'0") -->
  <line x1="135" y1="1180" x2="705" y2="1180" stroke="#000000" stroke-width="1.5" marker-start="url(#tick2)" marker-end="url(#tick2)" />
  <text x="420" y="1172" text-anchor="middle" font-size="13" font-weight="800">30'0" FULL FRONT DRIVEWAY SPAN</text>

  <!-- Depth dimension line -->
  <line x1="710" y1="535" x2="710" y2="1300" stroke="#000000" stroke-width="1.5" marker-start="url(#tick2)" marker-end="url(#tick2)" />
  <text x="698" y="910" text-anchor="middle" font-size="13" font-weight="800" transform="rotate(90 698 910)">38'6" CLEAR DEPTH</text>

  <!-- Sliding Gate (24' wide span) -->
  <line x1="180" y1="1300" x2="660" y2="1300" stroke="#0284c7" stroke-width="8"/>
  <text x="420" y="1290" text-anchor="middle" font-size="11" font-weight="800" fill="#0284c7">EXPANDED MAIN SLIDING ENTRANCE GATE (24'0")</text>

  <!-- FRONT ROAD BANNER -->
  <rect x="120" y="1315" width="600" height="45" fill="#0f172a" />
  <text x="420" y="1343" text-anchor="middle" font-size="14" font-weight="800" fill="#f8fafc" letter-spacing="1">▼ 30 FT WIDE FRONT ROAD (SOUTH FACING) ▼</text>
</svg>
